name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_VERSION: v1-w04
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w04-fec6b4e886c1.tar.gz
  COURSE_KIT_SHA256: fec6b4e886c19146078bf69fbf90a19279a4cd33f656642395350b299efeb226

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # Jazzy Pose is turtlesim/msg/Pose; package.xml still lists turtlesim_msgs for Lyrical.
          colcon build --symlink-install --packages-select turtle_bringup patrol
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          test -f "$(ros2 pkg prefix patrol)/lib/patrol/patrol"
          python3 -m py_compile src/patrol/patrol/patrol.py src/patrol/patrol/command.py
          python3 -m pytest src/patrol/test/test_command.py -q

      - name: Download course kit
        shell: bash
        run: |
          kit_archive="${RUNNER_TEMP:-/tmp}/course-kit.tar.gz"
          curl -fsSLo "$kit_archive" "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" "$kit_archive" | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf "$kit_archive" -C .course-kit
          test "$(tr -d '[:space:]' < .course-kit/v1/VERSION)" = "$COURSE_KIT_VERSION"

      - name: Check PR evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR04 --submission .
