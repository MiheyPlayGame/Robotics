name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_VERSION: v1-w07
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
  COURSE_KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop-full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ROS deps
        shell: bash
        run: |
          apt-get update
          apt-get upgrade -y --with-new-pkgs
          apt-get install -y --no-install-recommends \
            ros-lyrical-ackermann-msgs \
            ros-lyrical-ros-gz \
            python3-pytest \
            ros-lyrical-rosbag2-storage-mcap

      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-up-to course_simulation
          source install/setup.bash
          test -f "$(ros2 pkg prefix course_simulation)/share/course_simulation/launch/simulation.launch.py"
          test -f "$(ros2 pkg prefix course_simulation)/share/course_simulation/config/bridge.yaml"
          python3 -m pytest src/course_simulation/test -q

      - name: Download course kit
        shell: bash
        run: |
          kit_archive="${RUNNER_TEMP:-/tmp}/course-kit.tar.gz"
          curl -fsSLo "$kit_archive" "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" "$kit_archive" | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf "$kit_archive" -C .course-kit
          test "$(tr -d '[:space:]' < .course-kit/v1/VERSION)" = "$COURSE_KIT_VERSION"

      - name: Check PR evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR07 --submission .
