name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_VERSION: v1-w06
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w06-6eda53e1c566.tar.gz
  COURSE_KIT_SHA256: 6eda53e1c566f7f0a7e09d7afe1e5a6f3b98397175a7e57dede9a84c6d14d0fe

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select course_description
          source install/setup.bash
          test -f "$(ros2 pkg prefix course_description)/share/course_description/urdf/vehicle.urdf.xacro"
          test -f "$(ros2 pkg prefix course_description)/share/course_description/launch/display.launch.py"
          xacro src/course_description/urdf/vehicle.urdf.xacro > /tmp/vehicle.urdf
          check_urdf /tmp/vehicle.urdf
          python3 -m pytest src/course_description/test -q

      - name: Download course kit
        shell: bash
        run: |
          kit_archive="${RUNNER_TEMP:-/tmp}/course-kit.tar.gz"
          curl -fsSLo "$kit_archive" "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" "$kit_archive" | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf "$kit_archive" -C .course-kit
          test "$(tr -d '[:space:]' < .course-kit/v1/VERSION)" = "$COURSE_KIT_VERSION"

      - name: Check PR evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR06 --submission .
